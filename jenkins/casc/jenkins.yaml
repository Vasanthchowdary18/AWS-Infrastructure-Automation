# Jenkins Configuration as Code - values come from jenkins/.env (written on the server, never committed)
jenkins:
  systemMessage: "DevOps CI/CD - managed by JCasC"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: sonar-token
              description: SonarQube analysis token
              secret: "${SONAR_TOKEN}"

unclassified:
  location:
    url: "${JENKINS_URL}"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: sonarqube
        serverUrl: "http://sonarqube:9000"
        credentialsId: sonar-token

jobs:
  - script: |
      pipelineJob('devops-python-app') {
        description('CI/CD: tests -> SonarQube -> Docker -> Trivy -> ECR -> EKS')
        properties {
          githubProjectUrl('${REPO_URL}')
          pipelineTriggers {
            triggers {
              githubPush()
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${REPO_URL}') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
